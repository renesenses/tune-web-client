# Le seul garde-fou de ce dépôt s'appelle `npm test`. Il enchaîne quatre
# contrôles — dérive i18n, erreurs Svelte nouvelles, dialogues natifs, tests
# unitaires — et il n'a jamais été automatisé : il ne s'exécutait que si
# quelqu'un pensait à le lancer avant de merger.
#
# Le 15/08 quelqu'un n'y a pas pensé : deux clés hongroises ajoutées en
# français et en anglais mais pas en hongrois (#473) ont laissé `main` rouge
# pour tout le monde jusqu'au lendemain matin. Une clé manquante fait
# silencieusement retomber la langue concernée sur le français ; un identifiant
# non déclaré, que ce même gate attrape, fait un écran blanc chez l'utilisateur
# — et `npm run build` le laisse passer.
name: CI

# LA LIGNE DE VIE DU CLIENT V2 EST AJOUTEE ICI (Bertrand, 04/09/2026).
#
# `feat/client-v2-niveaux` ne fusionne JAMAIS vers `main` — c'est la doctrine
# du chantier. Elle ne remplissait donc aucune des deux conditions ci-dessous :
# ni `main`, ni une PR. Consequence mesuree le 04/09 : douze commits pousses
# dans la journee, ZERO execution de CI. Le seul « vert » etait un `npm test`
# lance a la main sur un Mac, alors que la CI tourne sur Linux avec une autre
# version de Node — exactement l'ecart qui a deja fait passer une regression.
#
# Une branche qui ne fusionne pas a d'autant plus besoin d'une porte : rien ne
# la rattrapera plus tard.
on:
  pull_request:
  push:
    branches: [main, feat/client-v2-niveaux, feat/v2-avatar-identite-et-i18n]

# Une PR poussée trois fois de suite n'occupe qu'un seul exécuteur : les runs
# précédents sont annulés.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` et non `npm install` : il installe EXACTEMENT le lockfile et
      # échoue si celui-ci a divergé de package.json — ce qui est précisément
      # le contrôle qu'on veut, le lockfile devant suivre chaque bump.
      - run: npm ci

      - run: npm test
